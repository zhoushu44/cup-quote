name: Build and Deploy

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  APP_VERSION: "1.0"
  IMAGE_NAME: paper-cup-quote

jobs:
  # ---------- 1. 构建并推送镜像到 GitHub Container Registry ----------
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 2. 通过 SSH 部署到服务器 ----------
  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy compose file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          source: "docker-compose.yml,deploy/nginx.conf,Dockerfile"
          target: "/opt/paper-cup-quote"
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          APP_VERSION: ${{ env.APP_VERSION }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          envs: GHCR_OWNER,GHCR_USER,GHCR_TOKEN,APP_VERSION
          script: |
            set -e
            cd /opt/paper-cup-quote

            # 登录 GHCR（拉私有镜像需要）
            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            export GITHUB_REPOSITORY_OWNER="$GHCR_OWNER"
            export APP_VERSION="$APP_VERSION"

            # 构建并滚动重启
            docker compose pull || true
            docker compose up -d --build --remove-orphans

            # 等待健康检查通过
            for i in $(seq 1 20); do
              if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
                echo "✅ 部署成功，服务已就绪"
                docker image prune -f
                exit 0
              fi
              echo "等待服务启动 ($i/20)..."
              sleep 3
            done

            echo "❌ 健康检查未通过，输出最近日志："
            docker compose logs --tail=80
            exit 1

      - name: Smoke test
        run: |
          echo "站点部署完成：http://${{ secrets.SERVER_HOST }}:8080"
