# ============================================================
# 纸杯报价系统 · 容器编排
# 用法：
#   docker compose up -d
# 访问：http://<服务器IP>:6655
# ============================================================
services:
  web:
    image: ${DOCKER_HUB_USERNAME:-local}/paper-cup-quote:${APP_VERSION:-1.0}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-1.0}
    container_name: paper-cup-quote
    restart: unless-stopped

    # 宿主机 6655 → 容器 80
    ports:
      - "0.0.0.0:6655:80"

    # 只读根文件系统（nginx 需要的目录挂成 tmpfs）
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
